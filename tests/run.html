<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>막차 테스트</title>
  <!-- Node 없이 브라우저에서 같은 테스트 파일을 실행 -->
  <script type="importmap">
    { "imports": { "node:test": "./shim-test.js", "node:assert/strict": "./shim-assert.js" } }
  </script>
  <style>
    body { font: 14px/1.5 ui-monospace, monospace; background: #0f1420; color: #eef1f7; padding: 16px; }
    .ok { color: #5fd3a0; } .fail { color: #ff6b6b; }
  </style>
</head>
<body>
  <pre id="out">실행 중…</pre>
  <script type="module">
    import { run } from './shim-test.js';
    await import('./time.test.js');
    const results = await run();
    const out = document.getElementById('out');
    out.innerHTML = '';
    for (const r of results) {
      const line = document.createElement('div');
      line.className = r.ok ? 'ok' : 'fail';
      line.textContent = `${r.ok ? '✓' : '✗'} ${r.name}${r.ok ? '' : ` — ${r.error}`}`;
      out.append(line);
    }
    const failed = results.filter((r) => !r.ok).length;
    const sum = document.createElement('div');
    sum.textContent = `\n${results.length - failed}/${results.length} 통과`;
    out.append(sum);
    document.title = failed ? `실패 ${failed}` : '모두 통과';
  </script>
</body>
</html>
